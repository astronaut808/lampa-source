name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
        env:
          BUILD_REVISION: ${{ github.sha }}

      - name: Verify artifacts
        run: |
          test -s build/web/index.html
          test -s build/web/app.js
          test -s build/web/custom/build-info.json

  container:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --target runtime --build-arg BUILD_REVISION="${GITHUB_SHA}" -t astronaut-lampa:ci .

      - name: Build metrics image
        run: docker build --target metrics -t astronaut-lampa-metrics:ci .

      - name: Create test network
        run: docker network create astronaut-lampa-ci

      - name: Start metrics collector
        run: >-
          docker run --rm -d
          --name metrics
          --network astronaut-lampa-ci
          astronaut-lampa-metrics:ci

      - name: Start container
        run: >-
          docker run --rm -d
          --name astronaut-lampa-ci
          --network astronaut-lampa-ci
          -p 127.0.0.1:18090:8080
          --read-only
          --tmpfs /tmp:size=16m,mode=1777
          --tmpfs /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
          --security-opt no-new-privileges:true
          --cap-drop ALL
          astronaut-lampa:ci

      - name: Smoke test
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18090/healthz; then
              curl -fsS http://127.0.0.1:18090/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs astronaut-lampa-ci
          exit 1

      - name: Smoke test metrics
        run: |
          curl -fsS -X POST http://127.0.0.1:18090/metrics/startup \
            -H 'Content-Type: application/json' \
            --data '{"schema_version":1,"totals":{"ui_visible_ms":1234}}'
          curl -fsS http://127.0.0.1:18090/metrics | grep '1234'

      - name: Stop container
        if: always()
        run: |
          docker stop astronaut-lampa-ci || true
          docker stop metrics || true
          docker network rm astronaut-lampa-ci || true
