name: Publish GHCR image

on:
  push:
    branches:
      - custom/main
    tags:
      - custom-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  METRICS_IMAGE_NAME: ${{ github.repository }}-metrics

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # To restore ARM64, uncomment QEMU and replace platforms in BOTH builds
      # with the commented multi-platform value below.
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4
      #   with:
      #     platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/custom/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Generate metrics image metadata
        id: metrics_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.METRICS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/custom/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v7
        timeout-minutes: 15
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,version=2,scope=lampa-runtime,timeout=2m
          cache-to: type=gha,version=2,scope=lampa-runtime,mode=max,timeout=2m,ignore-error=true
          provenance: true
          sbom: true

      - name: Build and publish metrics image
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          target: metrics
          push: true
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metrics_metadata.outputs.tags }}
          labels: ${{ steps.metrics_metadata.outputs.labels }}
          cache-from: type=gha,version=2,scope=lampa-metrics,timeout=2m
          cache-to: type=gha,version=2,scope=lampa-metrics,mode=max,timeout=2m,ignore-error=true
          provenance: true
          sbom: true
