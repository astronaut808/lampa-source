services:
  metrics:
    build:
      context: ..
      dockerfile: Dockerfile
      target: metrics
    image: astronaut-lampa-metrics:${IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    volumes:
      - lampa-metrics:/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50

  lampa:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    image: astronaut-lampa:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${LAMPA_BIND_ADDRESS:-0.0.0.0}:${LAMPA_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100

volumes:
  lampa-metrics:
