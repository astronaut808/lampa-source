server {
    listen 8080;
    server_name _;
    server_tokens off;

	root /usr/share/nginx/html;
	index index.html;
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types text/css application/javascript application/json application/xml image/svg+xml;
	resolver 127.0.0.11 valid=30s ipv6=off;
	set $metrics_backend http://metrics:9100;

	location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
	}

	location = /readyz {
		proxy_pass $metrics_backend/health/ready;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /health/dependencies {
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 7s;
	}

	location = /metrics {
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/history {
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/startup {
		limit_except POST { deny all; }
		client_max_body_size 64k;
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/playback {
		limit_except GET POST { deny all; }
		client_max_body_size 64k;
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/playback/history {
		limit_except GET DELETE { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/card {
		limit_except GET POST { deny all; }
		client_max_body_size 64k;
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/card/history {
		limit_except GET DELETE { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/card/summary {
		limit_except GET { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/network {
		limit_except GET POST { deny all; }
		client_max_body_size 64k;
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/network/history {
		limit_except GET DELETE { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/network/summary {
		limit_except GET { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/synthetic {
		limit_except GET { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/synthetic/history {
		limit_except GET DELETE { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 3s;
	}

	location = /metrics/synthetic/run {
		limit_except POST { deny all; }
		proxy_pass $metrics_backend;
		proxy_connect_timeout 1s;
		proxy_read_timeout 35s;
	}

    location = /runtime-config.js {
        root /tmp;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /runtime-config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
