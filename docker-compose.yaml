services:
  metrics:
    image: "${LAMPA_METRICS_IMAGE:-ghcr.io/astronaut808/lampa-source-metrics}:${LAMPA_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    environment:
      SYNTHETIC_MONITORING_ENABLED: "${SYNTHETIC_MONITORING_ENABLED:-true}"
      SYNTHETIC_INTERVAL_MS: "${SYNTHETIC_INTERVAL_MS:-60000}"
      SYNTHETIC_TIMEOUT_MS: "${SYNTHETIC_TIMEOUT_MS:-5000}"
      SYNTHETIC_DNS_TARGETS: "${SYNTHETIC_DNS_TARGETS:-tmdb_images=image.tmdb.org,cub_api=apitmdb.cub.rip,cub=cub.rip}"
      SYNTHETIC_HTTP_TARGETS: "${SYNTHETIC_HTTP_TARGETS:-lampa=http://lampa:8080/healthz,cub=https://cub.rip/}"
    read_only: true
    volumes:
      - lampa-metrics:/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  lampa:
    image: "${LAMPA_IMAGE:-ghcr.io/astronaut808/lampa-source}:${LAMPA_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    environment:
      LAMPA_CUB_TELEMETRY_ENABLED: "${LAMPA_CUB_TELEMETRY_ENABLED:-false}"
      LAMPA_BUILTIN_ADS_ENABLED: "${LAMPA_BUILTIN_ADS_ENABLED:-false}"
      LAMPA_SHOTS_ENABLED: "${LAMPA_SHOTS_ENABLED:-false}"
      LAMPA_PLAYBACK_METRICS_ENABLED: "${LAMPA_PLAYBACK_METRICS_ENABLED:-true}"
      LAMPA_CARD_METRICS_ENABLED: "${LAMPA_CARD_METRICS_ENABLED:-true}"
      LAMPA_NETWORK_METRICS_ENABLED: "${LAMPA_NETWORK_METRICS_ENABLED:-true}"
    ports:
      - "${LAMPA_BIND_ADDRESS:-0.0.0.0}:${LAMPA_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  lampa-metrics:
